plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}


// ---------------------------------------------------------------
//  Report generation
// ---------------------------------------------------------------

def reportsDir = layout.buildDirectory.dir('reports')

// Copy the hand-written web content (index.md, etc.) into build/reports/
tasks.register('copyWebContent', Copy) {
    description = 'Copies src/main/html/ into build/reports/.'
    dependsOn 'build'
    from 'src/main/html'
    into reportsDir
}

// Copy the generated documentation (build/docs/javadoc/) into build/reports/
tasks.register('copyDocs', Copy) {
    description = 'Copies build/docs/ into build/reports/.'
    dependsOn 'build', 'javadoc'
    from layout.buildDirectory.dir('docs')
    into reportsDir
}

// Build, test, generate javadoc, and collect everything in build/reports/
tasks.register('reports') {
    group = 'documentation'
    description = 'Assembles test and javadoc reports in build/reports/.'
    dependsOn 'build', 'javadoc', 'copyWebContent', 'copyDocs'
    doLast {
        println 'reports has completed.'
    }
}


// ---------------------------------------------------------------
//  Report deployment (GitHub Pages, gh-pages branch)
// ---------------------------------------------------------------

gitPublish {
    repoUri = 'git@github.com:ODU-CS351-F26/CS351--exercise-documentation--KyleSelv.git'
    branch = 'gh-pages'
    sign = false
    commitMessage = 'Publish project reports'

    contents {
        // Site home page at the root of gh-pages
        from('src/main/html')
        // The whole build/reports/ directory, published as reports/
        from(reportsDir) {
            into 'reports'
        }
    }
}

// Make sure the reports exist before anything is copied for publishing
tasks.named('gitPublishCopy') {
    dependsOn 'reports'
}

// Build the reports and push them to the website
tasks.register('deployReports') {
    group = 'documentation'
    description = 'Generates the reports and publishes them to GitHub Pages.'
    dependsOn 'reports', 'gitPublishPush'
}

